  <rect class="d-box" x="530" y="256" width="190" height="60" rx="8"/><text class="d-mono" x="542" y="274">kite://</text><text class="d-dim" x="542" y="290">새 탭 · 설정 · 북마크</text>

  <line class="d-line" x1="400" y1="106" x2="530" y2="106" marker-end="url(#d-head)" marker-start="url(#d-head)"/><text class="d-label" x="465" y="101" text-anchor="middle">invoke · 이벤트</text>
  <line class="d-line" x1="400" y1="156" x2="530" y2="156" marker-end="url(#d-head)" marker-start="url(#d-head)"/><text class="d-label" x="465" y="151" text-anchor="middle">invoke · 이벤트</text>
  <line class="d-line" x1="400" y1="204" x2="530" y2="204" marker-end="url(#d-head)"/><text class="d-label" x="465" y="199" text-anchor="middle">JS 실행</text>
  <line class="d-line" x1="530" y1="230" x2="400" y2="230" marker-end="url(#d-head)"/><text class="d-label" x="465" y="225" text-anchor="middle">content_event</text>
  <line class="d-line" x1="400" y1="286" x2="530" y2="286" marker-end="url(#d-head)" marker-start="url(#d-head)"/><text class="d-label" x="465" y="281" text-anchor="middle">invoke (로컬만)</text>

  <rect class="d-ext" x="16" y="186" width="140" height="58" rx="10"/>
  <text class="d-head" x="86" y="210" text-anchor="middle">AI 에이전트</text>
  <text class="d-dim" x="86" y="228" text-anchor="middle">Claude Code 등</text>
  <line class="d-line" x1="156" y1="217" x2="200" y2="217" marker-end="url(#d-head)"/>
  <text class="d-label" x="86" y="262" text-anchor="middle">HTTP · 127.0.0.1</text>
  <text class="d-label" x="86" y="276" text-anchor="middle">Bearer 토큰</text>

