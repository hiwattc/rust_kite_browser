<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-label="Kite 시스템 구성도"><style>
text{font-family:-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:11px;fill:#1c2230}
.d-title{font-size:12px;font-weight:650;fill:#5d6576}.d-head{font-size:12.5px;font-weight:650}.d-dim{fill:#5d6576}
.d-label{fill:#8a92a3;font-size:10px}.d-mono{font-family:ui-monospace,"SF Mono",Consolas,monospace;font-weight:600;fill:#6d4aff}
.d-app{fill:#efebff;stroke:#c4b6ff}.d-box{fill:#fff;stroke:#c9ced8}.d-stack{opacity:.6}.d-pill{fill:#e9ecf1}
.d-ext{fill:#fff;stroke:#6d4aff;stroke-dasharray:4 3}.d-os{fill:#f0f2f5;stroke:#dde1e8}.d-line{stroke:#8a92a3;stroke-width:1.3}
.d-dash{stroke-dasharray:4 3}.d-headfill{fill:#8a92a3}</style><rect width="760" height="460" fill="#f6f7f9"/>
  <defs><marker id="d-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="d-headfill"/></marker></defs>

  <rect class="d-app" x="176" y="16" width="568" height="330" rx="14"/>
  <text class="d-title" x="192" y="40">Kite 앱 · Tauri v2 (프로세스 하나, 창 하나)</text>

  <rect class="d-box" x="190" y="56" width="210" height="276" rx="10"/>
  <text class="d-head" x="202" y="76">Rust 코어</text>
  <rect class="d-pill" x="200" y="86" width="190" height="22" rx="6"/><text class="d-mono" x="210" y="101">browser.rs</text><text class="d-dim" x="380" y="101" text-anchor="end">탭 상태·웹뷰 배치</text>
  <rect class="d-pill" x="200" y="116" width="190" height="22" rx="6"/><text class="d-mono" x="210" y="131">keymap.rs</text><text class="d-dim" x="380" y="131" text-anchor="end">단축키 표</text>
  <rect class="d-pill" x="200" y="146" width="190" height="22" rx="6"/><text class="d-mono" x="210" y="161">palette.rs</text><text class="d-dim" x="380" y="161" text-anchor="end">검색·한영 보정</text>
  <rect class="d-pill" x="200" y="176" width="190" height="22" rx="6"/><text class="d-mono" x="210" y="191">automation.rs</text><text class="d-dim" x="380" y="191" text-anchor="end">탭에서 JS 실행</text>
  <rect class="d-pill" x="200" y="206" width="190" height="22" rx="6"/><text class="d-mono" x="210" y="221">mcp.rs</text><text class="d-dim" x="380" y="221" text-anchor="end">MCP 서버·도구</text>
  <rect class="d-pill" x="200" y="236" width="190" height="22" rx="6"/><text class="d-mono" x="210" y="251">pages.rs</text><text class="d-dim" x="380" y="251" text-anchor="end">내부 페이지 명령</text>
