name: Windows smoke test

# Builds Kite on Windows, starts it, and checks that the UI keeps answering (Windows marks a
# window "Not Responding" when its thread stops handling messages). Uploads kite.log, which has
# the main-thread watchdog's report if it stalls.
on:
  workflow_dispatch:
  push:
    branches: ["diag/**"]

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: smoke
      - run: npm ci
      - run: npm run build
      # What `tauri build` does (pages from the bundled files, not the dev server), minus the installer.
      - name: Build (release, no installer)
        working-directory: src-tauri
        run: cargo build --release --features tauri/custom-protocol
      # A portable kite.exe with the diagnostics (log + watchdog), to run on a PC that hangs.
      - uses: actions/upload-artifact@v4
        with:
          name: kite-windows-exe
          path: src-tauri/target/release/kite.exe
      - name: Start Kite and watch it
        shell: pwsh
        run: |
          $env:RUST_LOG = "kite_lib=debug"
          $p = Start-Process -FilePath "src-tauri\target\release\kite.exe" -PassThru
          $hung = 0
          foreach ($i in 1..45) {
            Start-Sleep -Seconds 1
            $p.Refresh()
            if ($p.HasExited) { Write-Host "Kite exited with code $($p.ExitCode) after $i s"; break }
            if (-not $p.Responding) { $hung++; Write-Host "t=$i s: NOT RESPONDING" } else { Write-Host "t=$i s: ok (window '$($p.MainWindowTitle)')" }
          }
          # Use it like a person would, through its MCP server (each call needs the main thread).
          $tokenFile = Join-Path $env:APPDATA "com.kite.browser\mcp-token"
          if (-not $p.HasExited -and (Test-Path $tokenFile)) {
            $token = (Get-Content $tokenFile -Raw).Trim()
            $h = @{ Authorization = "Bearer $token"; Accept = "application/json, text/event-stream" }
            $url = "http://127.0.0.1:17321/mcp"
            function Rpc($body) {
              try {
                $r = Invoke-WebRequest -Uri $url -Method Post -Body $body -ContentType "application/json" -Headers $h -TimeoutSec 20
                if ($r.Headers["Mcp-Session-Id"]) { $script:h["Mcp-Session-Id"] = "$($r.Headers["Mcp-Session-Id"])" }
                $text = "$($r.Content)"; if ($text.Length -gt 300) { $text = $text.Substring(0, 300) }
                Write-Host "  -> HTTP $($r.StatusCode) $text"
              } catch { Write-Host "  -> FAILED: $_" }
            }
            Write-Host "MCP initialize"; Rpc '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"smoke","version":"1"}}}'
            Rpc '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            $calls = @(
              '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"browser_tabs","arguments":{"action":"list"}}}',
              '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"browser_navigate","arguments":{"url":"https://example.com/"}}}',
              '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"browser_snapshot","arguments":{}}}',
              '{"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"browser_tabs","arguments":{"action":"new","url":"kite://home"}}}',
              '{"jsonrpc":"2.0","id":6,"method":"tools/call","params":{"name":"browser_navigate","arguments":{"url":"kite://settings"}}}',
              '{"jsonrpc":"2.0","id":7,"method":"tools/call","params":{"name":"browser_tabs","arguments":{"action":"list"}}}'
            )
            foreach ($c in $calls) {
              Write-Host "MCP $($c.Substring(60, [Math]::Min(80, $c.Length - 60)))"; Rpc $c
              Start-Sleep -Seconds 2; $p.Refresh()
              if ($p.HasExited) { Write-Host "Kite exited with code $($p.ExitCode)"; break }
              if (-not $p.Responding) { $hung++; Write-Host "  NOT RESPONDING after this call" }
            }
            foreach ($i in 1..10) { Start-Sleep -Seconds 1; $p.Refresh(); if (-not $p.HasExited -and -not $p.Responding) { $hung++; Write-Host "t+$i s: NOT RESPONDING" } }
          }
          # Real mouse clicks and typing on the window (what a person does), then a screenshot.
          if (-not $p.HasExited) {
            Add-Type -AssemblyName System.Drawing, System.Windows.Forms
            Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class U {
            [StructLayout(LayoutKind.Sequential)] public struct R { public int L, T, Rt, B; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out R r);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint f, uint x, uint y, uint d, IntPtr e);
            [DllImport("user32.dll")] public static extern uint GetDpiForWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern bool IsZoomed(IntPtr h);
            [DllImport("user32.dll")] public static extern bool IsIconic(IntPtr h);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int c);
            [DllImport("user32.dll")] public static extern bool SetWindowPos(IntPtr h, IntPtr a, int x, int y, int w, int hh, uint f);
            public static void Drag(int x, int y, int dx, int dy) { SetCursorPos(x, y); mouse_event(2, 0, 0, 0, IntPtr.Zero); System.Threading.Thread.Sleep(120); for (int i = 1; i <= 10; i++) { SetCursorPos(x + dx * i / 10, y + dy * i / 10); System.Threading.Thread.Sleep(30); } System.Threading.Thread.Sleep(120); mouse_event(4, 0, 0, 0, IntPtr.Zero); }
            public static void Click(int x, int y) { SetCursorPos(x, y); mouse_event(2, 0, 0, 0, IntPtr.Zero); mouse_event(4, 0, 0, 0, IntPtr.Zero); }
          }
          "@
            $p.Refresh(); $hw = $p.MainWindowHandle
            [U]::SetForegroundWindow($hw) | Out-Null
            $r = New-Object U+R; [U]::GetWindowRect($hw, [ref]$r) | Out-Null
            $s = [U]::GetDpiForWindow($hw) / 96.0
            Write-Host "window rect $($r.L),$($r.T)-$($r.Rt),$($r.B) scale $s"
            function At($x, $y) { [int]($r.L + $x * $s), [int]($r.T + $y * $s) }
            $steps = @(
              @("address bar", 400, 60), @("type", 0, 0), @("tab strip", 160, 22), @("page", 600, 400),
              @("address bar again", 500, 60), @("settings button", 1222, 60), @("page again", 640, 500), @("new tab +", 0, 0)
            )
            foreach ($st in $steps) {
              $name = $st[0]
              if ($name -eq "type") { [System.Windows.Forms.SendKeys]::SendWait("example.org"); Start-Sleep -Milliseconds 400; [System.Windows.Forms.SendKeys]::SendWait("{ENTER}") }
              elseif ($name -eq "new tab +") { [System.Windows.Forms.SendKeys]::SendWait("^t"); Start-Sleep -Milliseconds 400; [System.Windows.Forms.SendKeys]::SendWait("{ESC}") }
              else { $xy = At $st[1] $st[2]; [U]::Click($xy[0], $xy[1]) }
              Start-Sleep -Seconds 2; $p.Refresh()
              if ($p.HasExited) { Write-Host "Kite exited during '$name'"; break }
              Write-Host "after '$name': responding=$($p.Responding)"
              if (-not $p.Responding) { $hung++ }
            }
            foreach ($i in 1..8) { Start-Sleep -Seconds 1; $p.Refresh(); if (-not $p.HasExited -and -not $p.Responding) { $hung++; Write-Host "after clicks t+$i s: NOT RESPONDING" } }
            # Window frame (no title bar on Windows): buttons, drag, maximize, resize edges.
            function Shot($name) { $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds; $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height; $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size); $bmp.Save("$env:RUNNER_TEMP\$name.png") }
            function Rect() { $q = New-Object U+R; [U]::GetWindowRect($hw, [ref]$q) | Out-Null; $q }
            function Show($label) { $q = Rect; Write-Host "$label rect=$($q.L),$($q.T)-$($q.Rt),$($q.B) zoomed=$([U]::IsZoomed($hw)) iconic=$([U]::IsIconic($hw))" }
            [U]::SetForegroundWindow($hw) | Out-Null; Start-Sleep -Milliseconds 500
            Show "start"; Shot "frame-normal"
            $q = Rect; $W = $q.Rt - $q.L
            # move: drag the empty part of the tab strip
            [U]::Drag([int]($q.L + $W * 0.62), $q.T + 18, 80, 40); Start-Sleep -Milliseconds 600; Show "after drag-move (+80,+40)"
            # back where it was (the runner's screen is small: keep the buttons on it), and narrower than the screen
            $q = Rect; [U]::Drag([int]($q.L + $W * 0.62), $q.T + 18, -80, -40); Start-Sleep -Milliseconds 600; Show "after drag back"
            $q = Rect; if ($q.Rt -gt 1000) { [U]::Drag($q.Rt + 3, [int](($q.T + $q.B) / 2), -140, 0); Start-Sleep -Milliseconds 600; Show "after shrink (right edge -140)" }
            $q = Rect; $W = $q.Rt - $q.L
            # maximize / restore with the strip buttons (46px each, right edge)
            $q = Rect; [U]::Click($q.Rt - 69, $q.T + 18); Start-Sleep -Seconds 1; Show "after max click"
            $wa = [System.Windows.Forms.Screen]::PrimaryScreen.WorkingArea; Write-Host "work area $($wa.Left),$($wa.Top)-$($wa.Right),$($wa.Bottom)"
            Shot "frame-maximized"
            $q = Rect; [U]::Click($q.Rt - 69, $q.T + 18); Start-Sleep -Seconds 1; Show "after restore click"
            # double-click the strip: maximize, again: restore
            $q = Rect; [U]::Click([int]($q.L + $W * 0.62), $q.T + 18); [U]::Click([int]($q.L + $W * 0.62), $q.T + 18); Start-Sleep -Seconds 1; Show "after double-click"
            if ([U]::IsZoomed($hw)) { $q = Rect; [U]::Click($q.Rt - 69, $q.T + 18); Start-Sleep -Seconds 1 }
            # resize: first a window that fits the runner's small screen, then each edge
            # (topmost while testing: the runner's own console window may come in front of Kite)
            [U]::SetWindowPos($hw, [IntPtr](-1), 100, 80, 800, 520, 0x40) | Out-Null; [U]::SetForegroundWindow($hw) | Out-Null; Start-Sleep -Milliseconds 800; Show "set 800x520 at 100,80 (topmost)"; Shot "frame-small"
            $q = Rect; [U]::Drag([int]($q.L + 300), $q.T + 2, 0, -40); Start-Sleep -Milliseconds 700; Show "after top-edge drag -40 (expect taller)"
            $q = Rect; [U]::Drag($q.Rt + 3, [int](($q.T + $q.B) / 2), 60, 0); Start-Sleep -Milliseconds 700; Show "after right-edge drag +60 just outside (expect wider)"
            $q = Rect; [U]::Drag($q.Rt - 2, [int](($q.T + $q.B) / 2), 40, 0); Start-Sleep -Milliseconds 700; Show "after right-edge drag +40 just inside"
            $q = Rect; [U]::Drag([int](($q.L + $q.Rt) / 2), $q.B + 3, 0, 50); Start-Sleep -Milliseconds 700; Show "after bottom-edge drag +50 just outside (expect taller)"
            $q = Rect; [U]::Drag($q.L - 3, [int](($q.T + $q.B) / 2), -40, 0); Start-Sleep -Milliseconds 700; Show "after left-edge drag -40 just outside (expect wider)"
            Shot "frame-resized"
            # minimize, then bring back
            $q = Rect; [U]::Click($q.Rt - 115, $q.T + 18); Start-Sleep -Seconds 1; Show "after min click"
            [U]::ShowWindow($hw, 9) | Out-Null; Start-Sleep -Seconds 1; Show "after restore from min"
            $p.Refresh(); if (-not $p.Responding) { $hung++; Write-Host "NOT RESPONDING after frame tests" }
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$env:RUNNER_TEMP\screen.png"); Write-Host "screenshot saved"
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Write-Host "not-responding samples: $hung"
          "HUNG=$hung" | Out-File -Append $env:GITHUB_ENV
      - name: Show kite.log
        if: always()
        shell: pwsh
        run: |
          $log = Join-Path $env:APPDATA "com.kite.browser\kite.log"
          if (Test-Path $log) { Get-Content $log } else { Write-Host "no log at $log" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kite-windows-log
          path: ${{ env.APPDATA }}\com.kite.browser\kite*.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kite-windows-screen
          path: ${{ runner.temp }}/*.png
      - name: Fail when the UI hung, stalled after startup, or events stormed
        if: always()
        shell: pwsh
        run: |
          $log = Join-Path $env:APPDATA "com.kite.browser\kite.log"
          $text = if (Test-Path $log) { Get-Content $log -Raw } else { "" }
          $storms = ([regex]::Matches($text, "window event storm")).Count
          # A stall while the first window starts WebView2 is expected; any later one is not.
          $stalls = ([regex]::Matches($text, "main thread stalled")).Count - ([regex]::Matches($text, "stalled.*create window 1")).Count
          Write-Host "not responding: $env:HUNG, storms: $storms, stalls after startup: $stalls"
          if ($env:HUNG -ne "0" -or $storms -gt 0 -or $stalls -gt 0) { exit 1 }
