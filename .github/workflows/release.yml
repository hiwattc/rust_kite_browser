name: Release

# Push a tag like v0.1.0 (same as "version" in src-tauri/tauri.conf.json) to build the
# installers and publish them as a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Kite ${{ github.ref_name }}
          releaseBody: |
            ## 설치
            - **Windows**: `Kite_*_x64-setup.exe` 실행 (현재 사용자에게 설치, 관리자 권한 불필요)
            - **macOS Apple Silicon**: `Kite_*_aarch64.dmg` / **Intel**: `Kite_*_x64.dmg`

            서명되지 않은 빌드입니다. macOS에서 "확인되지 않은 개발자" 경고가 뜨면 Finder에서 앱을 우클릭 → 열기,
            또는 `xattr -cr /Applications/Kite.app` 후 실행하세요. Windows SmartScreen 경고는 "추가 정보 → 실행".
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
